# Optional: Keep your projects in sync with template improvements
name: Template Sync

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Sync with template
        run: |
          git remote add template https://github.com/YOUR_USERNAME/template-repo.git
          git fetch template
          # Review changes manually before merging
          echo "Template updates available. Review with: git diff template/main"
